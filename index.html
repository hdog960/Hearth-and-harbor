<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#244d4b">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hearth & Harbor"><meta name="description" content="A joyful 2.5D pixel-art life sim for your phone.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=1.8.0"><title>Hearth & Harbor · Household Foundations</title></head>
<body><main id="game">
<canvas id="scene" aria-label="Hearth and Harbor 2.5D game world"></canvas>
<header class="top"><div class="brand panel"><div class="brand-mark">✿</div><div><strong>Hearth <span>&</span> Harbor</strong><small id="dateText">SPRING • DAY 1 • 8:00 AM</small></div></div><div class="money panel">🪙 <b id="coinText">250</b><i>♥</i><b id="heartText">0</b></div></header>
<div class="town-label" id="locationText">✦ MAPLEWOOD VILLAGE ✦</div>
<div class="prompt" id="prompt">TAP TO WALK · TAP A NEIGHBOR TO CHAT</div>
<div class="world-toast" id="toast" role="status" aria-live="polite"></div><div id="placementHint" class="placement-hint hidden" role="status"><span id="placementText">Tap the floor to place furniture</span><button id="cancelPlacement" type="button">Cancel</button></div>
<div class="emote" id="emote" hidden>♥</div>
<section id="conversation" class="conversation hidden" aria-label="Conversation"><div class="speech"><div class="speech-head"><div class="tiny-avatar" id="talkPortrait">🌷</div><div><strong id="talkName">Poppy</strong><small id="talkRole">Neighbor</small></div><button type="button" id="talkClose" class="xbtn" aria-label="Close conversation">✕</button></div><p id="talkText"></p><div id="talkActions" class="talk-actions"></div></div></section>
<div class="bottom"><section class="status panel"><div class="status-name"><span>🌼</span><strong id="playerName">Poppy</strong></div><div class="vitals"><div><label>FOOD</label><i><b id="needFood"></b></i></div><div><label>FUN</label><i><b id="needFun"></b></i></div><div><label>SOCIAL</label><i><b id="needSocial"></b></i></div><div><label>REST</label><i><b id="needEnergy"></b></i></div></div><button id="timeBtn" class="time-btn" aria-label="Change time speed">▶</button></section>
<nav class="nav panel" aria-label="Actions"><button id="townBtn" class="active"><span>🌳</span><small>Town</small></button><button id="homeBtn"><span>🏡</span><small>Home</small></button><button id="peopleBtn"><span>💌</span><small>People</small></button><button id="journalBtn"><span>📜</span><small>Journal</small></button><button id="decorateBtn"><span>🪑</span><small>Decor</small></button><button id="styleBtn"><span>🎀</span><small>Style</small></button><button id="menuBtn"><span>⚙️</span><small>Menu</small></button></nav></div>
<section id="modal" class="modal hidden" aria-label="Game actions" role="dialog" aria-modal="true"><div class="modal-card"><button id="closeModal" class="xbtn" aria-label="Close menu">✕</button><div id="modalContent"></div></div></section>
<div id="loading"><div class="load-card"><div class="load-sun">☀️</div><h1>HEARTH <span>&</span> HARBOR</h1><p>Welcome to your little corner of the world</p><div class="pixel-progress"></div></div></div>
</main><script defer src="game.js?v=1.8.0"></script></body></html>
